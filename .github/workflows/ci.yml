name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check . --output-format=github
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # throwaway CI-only credentials
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: support_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d support_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/support_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Pytest
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the test stack
        run: docker compose -f docker-compose.test.yml up -d --build
        env:
          MOCK_FAILURE_RATE: "0.3"
          MOCK_SLOW_RATE: "0"
          FAKE_LLM_DELAY_MIN: "1"
          FAKE_LLM_DELAY_MAX: "2"
      - name: Wait for health
        run: |
          timeout 180 bash -c 'until curl -fsS http://localhost:8000/health && curl -fsS http://localhost:8001/health; do sleep 2; done'
          test "$(curl -fsS http://localhost:8000/health)" = "OK"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Postman collection (newman)
        run: >-
          npx --yes newman@6 run postman/MomentumSupport.postman_collection.json
          -e postman/local.postman_environment.json --bail
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
