name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check . --output-format=github
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # throwaway CI-only credentials
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: support_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d support_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/support_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Pytest
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the test stack
        run: docker compose -f docker-compose.test.yml up -d --build
        env:
          MOCK_FAILURE_RATE: "0.3"
          MOCK_SLOW_RATE: "0"
          FAKE_LLM_DELAY_MIN: "1"
          FAKE_LLM_DELAY_MAX: "2"
      - name: Wait for health
        run: |
          timeout 180 bash -c 'until curl -fsS http://localhost:8000/health && curl -fsS http://localhost:8001/health; do sleep 2; done'
          test "$(curl -fsS http://localhost:8000/health)" = "OK"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Postman collection (newman)
        run: >-
          npx --yes newman@6 run postman/MomentumSupport.postman_collection.json
          -e postman/local.postman_environment.json --bail
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  deploy:
    # CD: only after lint, tests and the docker smoke test are green, only for main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, docker]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/momentum-support' }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "APP_IMAGE=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            Port ${{ vars.DEPLOY_PORT || '22' }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      - name: Upload compose file
        run: scp docker-compose.yml "deploy-target:$DEPLOY_PATH/docker-compose.yml"

      - name: Deploy
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh deploy-target bash -s -- "$DEPLOY_PATH" "$APP_IMAGE" "$GHCR_USER" "$GHCR_TOKEN" <<'EOF'
          set -euo pipefail
          cd "$1"
          test -f .env || { echo ".env is missing in $1 (see .env.example)"; exit 1; }
          # pin the deployed image in .env so a manual `docker compose up` keeps using it
          sed -i '/^APP_IMAGE=/d' .env && echo "APP_IMAGE=$2" >> .env
          echo "$4" | docker login ghcr.io -u "$3" --password-stdin
          docker compose pull --quiet
          docker compose up -d --no-build --remove-orphans
          docker logout ghcr.io
          for _ in $(seq 1 60); do
            if [ "$(docker compose exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health').read().decode())" 2>/dev/null)" = "OK" ]; then
              echo "healthy: $2"; docker image prune -f >/dev/null; exit 0
            fi
            sleep 3
          done
          docker compose ps; docker compose logs --tail 100 api migrate; exit 1
          EOF
